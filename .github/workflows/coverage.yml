name: Forge Coverage

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions: write-all

jobs:
  check:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install lcov
        uses: hrishikesh-kadam/setup-lcov@v1

      - name: Run coverage
        env:
          MNEMONIC: ${{ secrets.MNEMONIC_FOR_TESTS }}
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          timeout 30m make coverage-filtered profile=ci
        id: coverage

      - name: Debug lcov files
        run: |
          echo "=== Generated files ==="
          ls -lh lcov*.info
          echo ""
          echo "=== Source files in lcov.info ==="  
          grep "^SF:" lcov.info | head -20
          echo ""
          echo "=== Check for duplicates ==="
          grep "^SF:" lcov.info | sort | uniq -c | sort -rn | head -10

      - name: Generate HTML coverage report
        run: |
          genhtml lcov.info --output-directory coverage-html --rc branch_coverage=1 --ignore-errors inconsistent --quiet
          echo "HTML report generated in coverage-html/"

      - name: Print coverage summary
        run: |
          # Use custom script for per-file breakdown with correct percentages
          echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Filtered coverage for \`src/vaults/\` and \`src/distributor/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ./scripts/coverage-summary.sh lcov.info >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 View detailed HTML report in workflow artifacts" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: coverage-html/

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const summary = execSync(
              './scripts/coverage-summary.sh lcov.info',
              { encoding: 'utf-8' }
            ).trim();
            const commitSha = context.sha.substring(0, 7);
            const timestamp = new Date().toISOString();
            const body = '## 📊 Coverage Report\n\nFiltered coverage for `src/vaults/` and `src/distributor/`\n\n```\n' + summary + '\n```\n\n📄 [View detailed HTML report in workflow artifacts](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')\n\n_Updated for commit ' + commitSha + ' at ' + timestamp + '_';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const botComment = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes('📊 Coverage Report'));
            if (botComment) {
              console.log('Updating existing coverage comment...');
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              console.log('Creating new coverage comment...');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }
