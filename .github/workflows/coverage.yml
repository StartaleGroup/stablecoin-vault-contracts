name: Forge Coverage

on:
  push:
    branches:
      - main
      - dev
      - feat/increase-coverage
  pull_request:

permissions: write-all

jobs:
  check:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install lcov
        uses: hrishikesh-kadam/setup-lcov@v1

      - name: Run coverage
        env:
          MNEMONIC: ${{ secrets.MNEMONIC_FOR_TESTS }}
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          timeout 30m make coverage-filtered profile=ci
        id: coverage

      - name: Print coverage summary
        run: |
          echo "## 📊 Coverage Summary (src/vaults & src/distributor)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Filtered coverage focusing on production code in \`src/vaults/\` and \`src/distributor/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>📈 Detailed Coverage by File</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          lcov --list lcov.info 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No coverage data" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Extract and display overall coverage
          TOTAL_LINE=$(lcov --list lcov.info 2>/dev/null | grep "Total:" | tail -1)
          if [ -n "$TOTAL_LINE" ]; then
            LINE_COV=$(echo "$TOTAL_LINE" | awk '{print $2}')
            FUNC_COV=$(echo "$TOTAL_LINE" | awk '{print $4}')
            echo "### Overall Coverage" >> $GITHUB_STEP_SUMMARY
            echo "- **Lines:** $LINE_COV" >> $GITHUB_STEP_SUMMARY
            echo "- **Functions:** $FUNC_COV" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Report code coverage
        uses: zgosalvez/github-actions-report-lcov@v4
        with:
          coverage-files: lcov.info
          artifact-name: code-coverage-report
          minimum-coverage: 10
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
